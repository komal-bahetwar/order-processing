services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orderprocessing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderprocessing"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - order-postgres-data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=orderprocessing;Username=postgres;Password=postgres
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  order-postgres-data:
